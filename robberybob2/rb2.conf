# Robbery Bob 2 settings, read by "Robbery Bob 2.sh" before each launch.
# Positions are fractions of the screen: 0,0 = top-left, 1,1 = bottom-right.

# Where the virtual joystick is touched (left stick / d-pad) and how far it is
# dragged (fraction of the screen height).
export RB2_JOY="0.177,0.754"
export RB2_JOY_RADIUS="0.12"

# Fixed taps, held while the button is held (positions on a 4:3 screen):
# X = sprint shoe, Y = "+" use item (above the shoe), L1 = gadgets, R1 = fast forward.
export RB2_TAP_X="0.79,0.82"
export RB2_TAP_Y="0.86,0.72"
export RB2_TAP_L1="0.34,0.14"
export RB2_TAP_R1="0.22,0.14"
export RB2_TAP_L2=""
export RB2_TAP_R2=""

# Game language: en, fr, de, es, it, id, hi ... (empty = en)
export RB2_LANG=""

# 1 = detailed log (file opens, JNI calls, touches) in log.txt
export RB2_VERBOSE=1

# Graphics: empty = try GLES 1.1, then GLES 2.0 with built-in emulation.
# 1 = GLES 1.1 only, 2 = always use the GLES 2.0 emulation.
export RB2_GLES=""
